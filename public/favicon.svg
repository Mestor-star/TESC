<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- 与侧栏角标同一枚菱形：青→绯的签名渐变，中心一个「終」。
       图标只有 16px 的格子可用时，字要占满菱形才不至于糊成一团，
       所以这里的字号（28/64）比 38px 角标上的 17/38 更大。 -->
  <defs>
    <linearGradient id="zts" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#008eff"/>
      <stop offset="1" stop-color="#ff4e7f"/>
    </linearGradient>
  </defs>
  <rect x="12" y="12" width="40" height="40" rx="5" fill="url(#zts)" transform="rotate(45 32 32)"/>
  <text x="32" y="33" text-anchor="middle" dominant-baseline="middle" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="28" font-weight="700" fill="#0e1729">終</text>
</svg>
