<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- ?v=2 是图标换版时的一次性缓存绕过：favicon 的地址不带指纹，
         浏览器会一直用旧的；改图时把这个数字加一即可。 -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- `viewport-fit=cover` 是手机档的前提：**不加它，`env(safe-area-inset-*)` 恒为 0**，
         底条与吐司那两处安全区内边距会白写（刘海机上看不出来，是因为浏览器悄悄帮忙留了边）。
         加了之后版面才真的铺到圆角与 Home 指示条底下，由我们自己按 inset 让路。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- 浏览器外框的底色：跟着 tokens 的 --bg-0（晨光浅底）走，别留着旧暗底的 #07070c -->
    <meta name="theme-color" content="#f2f6ff" />
    <meta name="description" content="终末停滞委员会 · 停滞观测终端 —— 在终末逼近的日常中，做出选择、守护羁绊。" />
    <title>终末停滞委员会 · 停滞观测终端</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
